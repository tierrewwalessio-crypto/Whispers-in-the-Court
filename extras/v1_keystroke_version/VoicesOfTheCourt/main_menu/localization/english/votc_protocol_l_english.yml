 votc_evt_marriage:0        "VOTC1|EVT|royal_marriage|[GetDateString]|[ROOT.GetCountry.GetTag]|[SCOPE.sCountry('votc_evt_country').GetTag]"
 votc_evt_rank_change:0     "VOTC1|EVT|rank_change|[GetDateString]|[ROOT.GetCountry.GetTag]|rank=[ROOT.ScriptValue('votc_c_rank')|0]"
