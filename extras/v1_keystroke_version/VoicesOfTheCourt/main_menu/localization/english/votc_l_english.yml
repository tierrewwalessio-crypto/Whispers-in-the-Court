 votc_edict_trade_charter:0 "Charter of the Merchants"
 votc_edict_road_ordinance:0 "Ordinance on the Roads"
 votc_edict_muster:0 "Muster of the Realm"
 votc_edict_noble_confirmation:0 "Confirmation of Privileges"
 votc_edict_pious_endowment:0 "Pious Endowment"
 votc_edict_chancery_reform:0 "Reform of the Chancery"
 votc_edict_kings_justice:0 "The Crown's Justice"
 votc_edict_patronage_letters:0 "Patronage of Letters"
 votc_edict_toleration:0 "Edict of Toleration"
 votc_edict_debasement:0 "Debasement of the Coin"
 votc_edict_granaries:0 "The Granaries Opened"
 votc_edict_summon_estates:0 "The Estates Summoned"
 votc_progress_acclaimed:0 "The Ruler Was Seen"
 votc_progress_resented:0 "The Ruler Was Seen, and Resented"
 votc_char_trusted_counsel:0 "Trusted Counsel"
 votc_char_slighted:0 "Slighted at Court"
