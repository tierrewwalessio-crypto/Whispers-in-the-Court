l_english:

 STATIC_MODIFIER_NAME_votc_great_muster:0 "The Realm Rises in Arms"
 STATIC_MODIFIER_DESC_votc_great_muster:0 "In an hour of need the whole realm answers the Crown's call: every order sends more men than it owes, while the fields lie short of hands. It lasts two years (Whispers in the Court)."
 STATIC_MODIFIER_NAME_votc_great_works:0 "The Realm Builds as One"
 STATIC_MODIFIER_DESC_votc_great_works:0 "Carters, masons and the Crown's gold on every site of the realm. It lasts two years (Whispers in the Court)."
 STATIC_MODIFIER_NAME_votc_great_revival:0 "A Great Revival of the Faith"
 STATIC_MODIFIER_DESC_votc_great_revival:0 "Preachers in every town and village, and little patience for those who will not listen. It lasts two years (Whispers in the Court)."
