 votc_cmd_reload:0 "reload switchlanguage english;effect votc_loc_done = yes"
 votc_cmd_save:0 "save votc_world;effect remove_variable = votc_has_mail_save"
 votc_cmd_logs:0 "Log.ClearAll;effect remove_variable = votc_has_mail_logs"
 votc_cmd_poll:0 "run votc_poll.txt"
