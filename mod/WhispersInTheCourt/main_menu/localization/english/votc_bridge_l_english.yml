 # =====================================================================
 # Whispers in the Court - BRIDGE COMMANDS (generated; do not translate)
 #
 # gui/votc_bridge.gui runs these through ExecuteConsoleCommandsForced when a
 # signal variable goes up. Each is a ';'-separated list of console commands.
 # 'votc_say ...' is deliberately not a real command: the console records it
 # in console_history.txt, which is how Court Brain hears the game. The data
 # functions inside [ ] are resolved by the game at the moment of the click,
 # so the middleware always receives the realm as it is right now.
 #
 # votc_cmd_reload: Court Brain writes the game's own language here at install.
 # =====================================================================

