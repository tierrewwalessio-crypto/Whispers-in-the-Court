 votc_emit_ack:0 "votc_say ACK|mail=[GetPlayer.MakeScope.ScriptValue('votc_v_mailseq')|0]|budget=[GetPlayer.MakeScope.ScriptValue('votc_c_budget')|0]|refusals=[GetPlayer.MakeScope.ScriptValue('votc_v_refusals')|0]|mod=[GetPlayer.MakeScope.ScriptValue('votc_v_modver')|0]|date=[GetDateString]|loc=$votc_loc_stamp$;effect remove_variable = votc_sig_ack"
