l_english:

 # Whispers in the Court - the fixed texts of the interface.

 VOTC_HUD_BUTTON:0 "Court"
 VOTC_HUD_BUTTON_TT:0 "Open Whispers in the Court: the council, the chronicle and the people of your court."
 VOTC_ADVISOR_BUTTON:0 "AI Advisor"
 VOTC_ADVISOR_BUTTON_TT:0 "Talk directly with the AI advisor, outside the roleplay: questions, strategy advice, reports on what happened in the campaign or in a given period."

 votc_speak_with:0 "Speak with"
 votc_speak_with_desc:0 "Grant this person an audience. The court panel opens on the right: you speak, they answer, and what comes of it returns to the realm."
 votc_speak_with_desc_specific:0 "$votc_speak_with_desc$"
 votc_speak_with_concept:0 "[character|e]"
 votc_speak_with_act:0 "$votc_speak_with$"
 votc_speak_with_act_past:0 "You spoke with [SCOPE.sCharacter('recipient').GetName]"
 votc_speak_with_past:0 "You spoke with [SCOPE.sCharacter('recipient').GetName]"
 votc_speak_with_none:0 "There is no one to receive."
 votc_speak_foreign:0 "Speak with"
 votc_speak_foreign_desc:0 "Address this person of another court. The court panel opens on the right."
 votc_speak_foreign_desc_specific:0 "$votc_speak_foreign_desc$"
 votc_speak_foreign_concept:0 "[character|e]"
 votc_speak_foreign_act:0 "$votc_speak_foreign$"
 votc_speak_foreign_act_past:0 "You spoke with [SCOPE.sCharacter('recipient').GetName]"
 votc_speak_foreign_past:0 "You spoke with [SCOPE.sCharacter('recipient').GetName]"
 votc_speak_foreign_none:0 "There is no one to address."
 votc_choose_person:0 "Whom do you wish to speak with?"
 votc_choose_court:0 "Which court do you address?"

 votc_send_envoy:0 "Send an Envoy"
 dip_votc_send_envoy_CATEGORY:0 "CATEGORY_FRIENDLY_ACTIONS"
 votc_send_envoy_desc:0 "Your envoy carries your words to this court and brings back their answer. You talk it through in the court panel; alliances, truces, claims, wars or peace are put before you, and you decide."
 votc_send_envoy_act:0 "Send an Envoy"
 votc_send_envoy_effect_text:0 "The court panel opens."
 votc_send_envoy_effect_text_past:0 "You sent an envoy."
 PROPOSE_votc_send_envoy:0 "Send an Envoy"
 votc_send_envoy_none:0 "You know of no court to address."

 votc_request_meeting:0 "Request a Meeting"
 dip_votc_request_meeting_CATEGORY:0 "CATEGORY_FRIENDLY_ACTIONS"
 votc_request_meeting_desc:0 "Propose to their ruler that you meet in person, on neutral ground. A meeting face to face weighs more than any letter, for good or ill."
 votc_request_meeting_act:0 "Request a Meeting"
 votc_request_meeting_effect_text:0 "The court panel opens."
 votc_request_meeting_effect_text_past:0 "You met their ruler."
 PROPOSE_votc_request_meeting:0 "Request a Meeting"
 votc_request_meeting_none:0 "You know of no court to address."

 votc_state_visit:0 "Pay a State Visit"
 dip_votc_state_visit_CATEGORY:0 "CATEGORY_FRIENDLY_ACTIONS"
 votc_state_visit_desc:0 "Travel to their court yourself. It honours your host and exposes you: what you see and say there stays in the memory of both courts."
 votc_state_visit_act:0 "Pay a State Visit"
 votc_state_visit_effect_text:0 "The court panel opens."
 votc_state_visit_effect_text_past:0 "You visited their court."
 PROPOSE_votc_state_visit:0 "Pay a State Visit"
 votc_state_visit_none:0 "You know of no court to address."

 votc_summon_council:0 "Summon the Council"
 votc_summon_council_desc:0 "Call your ministers. They will raise what they think most urgent, not what you would rather hear, and you may answer with an edict."
 votc_hear_estate:0 "Hear an Estate"
 votc_hear_estate_desc:0 "Receive the spokesmen of one of the realm's orders and hear their case."
 votc_choose_estate:0 "Which estate do you wish to hear?"
 votc_royal_progress:0 "Royal Progress"
 votc_royal_progress_desc:0 "Leave the capital and show yourself in one of your lands. What happens depends on the place: its people, its faith, how firmly you hold it. It can go badly."
 votc_issue_decree:0 "Issue a Decree"
 votc_issue_decree_desc:0 "Act on your own authority and proclaim it to the realm. What follows depends on whom you rule and how: an absolute ruler loved by the people is obeyed; a weak one, or a republic bypassed, is not."
 votc_choose_destination:0 "Where do you wish to go?"

 votc_out_ok:0 "So be it."
 votc_opt_reply:0 "Answer in person..."
 votc_opt_biographer:0 "Speak with the royal biographer..."
 votc_opt_book:0 "Read the book of my life, as written so far..."
 votc_book_tt:0 "The royal biographer brings the book of your life up to the present and Court Brain shows it (at most 10,000 characters). Only what is new since you last read it is written: a modest use of AI tokens."
 votc_obt_ok:0 "May they rest in peace."
 votc_cen_later:0 "Another time."
 votc_cen_tt:0 "The biographer writes the history of the realm over these hundred years - rulers, wars, lands, faith and people - and Court Brain shows it. This uses MANY AI tokens, once: afterwards it can be read again for free from the Court menu, where you can also ask for it later."
 votc_life_tt:0 "The biographer writes the whole Life of the late ruler, from all the notes of the reign, and Court Brain shows it. This uses MANY AI tokens, once: afterwards the finished book can be read again for free from the Court menu."
 votc_chr_ok:0 "So it is written."
 votc_arc_reply:0 "Answer in your own way..."
 votc_knk_receive:0 "Receive them."
 votc_knk_refuse:0 "Send them away."
 votc_ntc_ok:0 "Very well."
 votc_need_debug_title:0 "Whispers in the Court: EU5 needs -debug_mode"
 votc_need_debug_body:0 "EU5 was started without the -debug_mode option. Without it the game cannot load the words Court Brain writes: events and decrees would come with no text, so the court stays silent.\n\nClose EU5 and start it again with the button #Y Start EU5#! in the Court Brain window.\n\nOr, in Steam: right-click Europa Universalis V, Properties, and under Launch Options write #Y -debug_mode#!, then start the game as usual."
 votc_need_debug_ok:0 "I will restart the game."

